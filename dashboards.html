<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeGraph App Redirect | Diptopal Roy</title>
    <meta
      name="description"
      content="Legacy TradeGraph dashboards route. Redirecting to the TradeGraph app overview."
    />
    <meta http-equiv="refresh" content="0; url=./tradegraph/app/overview.html" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="tradegraph">
    <script>
      (function () {
        const hash = window.location.hash.replace(/^#/, "");
        const routes = {
          "tenderradar-workspace": "./tradegraph/app/tenderradar/pipeline.html",
        };
        const target = routes[hash] || "./tradegraph/app/overview.html";
        window.location.replace(target);
      })();
    </script>
    <main class="page-stack">
      <section class="page-hero">
        <div class="page-hero-copy">
          <p class="eyebrow">TradeGraph App</p>
          <h1>Redirecting to the TradeGraph app shell.</h1>
          <p>
            The old `Dashboards` route has been replaced by a dedicated app tree with an overview page,
            product-specific workspaces, and ops views.
          </p>
          <div class="hero-actions">
            <a class="button button-primary" href="./tradegraph/app/overview.html">Open app overview</a>
            <a class="button button-secondary" href="./tradegraph/app/tenderradar/pipeline.html">Open TenderRadar</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>

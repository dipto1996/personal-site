<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeGraph Redirect | Diptopal Roy</title>
    <meta
      name="description"
      content="Legacy TradeGraph solutions route. Redirecting to the product-first TradeGraph subsite."
    />
    <meta http-equiv="refresh" content="0; url=./tradegraph/index.html" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="tradegraph">
    <script>
      (function () {
        const hash = window.location.hash.replace(/^#/, "");
        const routes = {
          "verifysme-workspace": "./tradegraph/app/verifysme/queue.html",
          "exportpulse-workspace": "./tradegraph/app/exportpulse/route-pipeline.html",
        };
        const target = routes[hash] || "./tradegraph/index.html";
        window.location.replace(target);
      })();
    </script>
    <main class="page-stack">
      <section class="page-hero">
        <div class="page-hero-copy">
          <p class="eyebrow">TradeGraph</p>
          <h1>Redirecting to the product-first TradeGraph subsite.</h1>
          <p>
            The old `Solutions` surface has been replaced by a dedicated TradeGraph tree with separate
            use-case pages, product pages, and app pages.
          </p>
          <div class="hero-actions">
            <a class="button button-primary" href="./tradegraph/index.html">Open TradeGraph</a>
            <a class="button button-secondary" href="./tradegraph/app/verifysme/queue.html">Open VerifySME</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
